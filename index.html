<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2a3a">
<title>Guido — Aventura do Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1b2a3a;overflow:hidden;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  font-family:'Press Start 2P',ui-monospace,monospace;color:#fff}
body{display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh}
#wrap{position:relative;overflow:hidden;background:#8fd3ff;flex:none;touch-action:none}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#overlay{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:rgba(15,25,40,.82);text-align:center;padding:16px;overflow:auto}
#overlay.hidden{display:none}
.title{font-size:30px;color:#fff;text-shadow:3px 3px 0 #2f5f9e,6px 6px 0 #000;letter-spacing:2px}
.sub{font-size:9px;color:#ffe08a;line-height:1.8}
.big{font-size:16px;color:#ffe08a;text-shadow:3px 3px 0 #000}
.play{font:inherit;font-size:12px;padding:12px 18px;background:#4f86c6;color:#fff;border:3px solid #fff;
  box-shadow:4px 4px 0 #000;cursor:pointer}
.play:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.help{font-size:8px;line-height:2;color:#dfe8f5;max-width:300px}
#prev{width:192px;height:208px;image-rendering:pixelated}
#overlay.menu{justify-content:flex-start;padding-top:max(9vh,env(safe-area-inset-top))}
#overlay.menu .title{font-size:clamp(46px,15vw,72px);letter-spacing:4px;text-shadow:4px 4px 0 #2f5f9e,8px 8px 0 #000}
/* letreiro da cafeteria em pixel art (logo Guido Café & Co.) — --p = tamanho de 1 pixel do letreiro */
.sign{position:relative;margin-top:2vh;--p:4px;transform-origin:50% -30vh;animation:swing 3.6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@media (prefers-reduced-motion:reduce){.sign{animation:none}}
.sign canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(var(--p) var(--p) 0 #000)}
.sign::before,.sign::after{content:'';position:absolute;bottom:calc(100% - var(--p));width:calc(var(--p)*2);height:60vh;
  background:repeating-linear-gradient(to top,#cfd6e2 0 calc(var(--p)*2),#7d8798 0 calc(var(--p)*3),#1d1d1b 0 calc(var(--p)*4))}
.sign::before{left:calc(var(--p)*11)}.sign::after{right:calc(var(--p)*11)}
#overlay.menu{background:#000}
html.menu-on,html.menu-on body{background:#000}html.menu-on #wrap{visibility:hidden} /* menu: só preto atrás, o jogo não aparece */
/* tela de parabéns: sem fundo, para ver o Guido tomando café na porta da cafeteria */
#overlay.win{justify-content:center;background:none;pointer-events:none} /* bottom é ajustado no JS: termina no topo da cafeteria */
#overlay.win .title{font-size:clamp(24px,8vw,34px)}
#overlay.win .big{font-size:12px;line-height:1.6;text-shadow:-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000,0 2px 0 #000,3px 3px 0 #000} /* contorno: fica legível sobre a loja */
/* acento agudo desenhado à mão: o É maiúsculo da fonte pixel sai parecendo minúsculo */
.ac{position:relative}.ac::after{content:'';position:absolute;left:35%;top:-.32em;width:.34em;height:.14em;background:currentColor;
  transform:skewY(-30deg);box-shadow:.1em .1em 0 #2f5f9e,.2em .2em 0 #000}
/* posições definidas no Figma (tela de 390x844): Guido do menu em 37,4% da altura, botões em 74,8% */
#overlay.menu #prev{position:absolute;top:37.4%;left:0;right:0;margin:0 auto}
#overlay .play.low{position:absolute;top:74.8%;left:0;right:0;margin:0 auto;width:fit-content}
.sub.keep{margin-bottom:59px} /* ocupa o lugar do botão para o título não descer */
/* botões de movimento na faixa de terra de baixo: ◀ ▶ à esquerda, pular à direita */
#pad{position:absolute;left:0;right:0;bottom:0;height:20%;z-index:2;display:none;align-items:center;justify-content:space-between;
  padding:0 7% calc(env(safe-area-inset-bottom)*.5)}
#pad.on{display:flex}
/* botão da tela final: mesma faixa (e mesma altura) dos botões de controle */
#endbar{position:absolute;left:0;right:0;bottom:0;height:20%;z-index:6;display:none;align-items:center;justify-content:center;
  padding:0 7% calc(env(safe-area-inset-bottom)*.5)}
#endbar.on{display:flex}#pad .grp{display:flex;gap:min(4vw,16px)}
#pad button{flex:none;width:19vw;max-width:76px;min-width:56px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  background:#4f86c6;border:3px solid #fff;box-shadow:4px 4px 0 #000;touch-action:none;cursor:pointer;padding:0}
#pad button svg{width:46%;height:46%;image-rendering:pixelated;fill:#fff}
#pad button.dn{transform:translate(2px,2px);box-shadow:2px 2px 0 #000;background:#2f5f9e}
#pad button.dn svg{fill:#ffe08a}
/* tutorial de movimento (aparece depois da tela inicial) */
#tut{position:absolute;left:50%;top:15%;transform:translateX(-50%);width:min(88%,330px);z-index:3;pointer-events:none;
  background:rgba(15,25,40,.88);border:3px solid #fff;box-shadow:4px 4px 0 #000;padding:12px 12px 14px;text-align:center;
  display:none;flex-direction:column;align-items:center;gap:9px;transition:opacity .25s}
#tut.on{display:flex}#tut.fade{opacity:0}
#tut .tt{font-size:15.6px;color:#ffe08a;text-shadow:2px 2px 0 #000}
#tut .tx{font-size:8px;line-height:1.9;color:#fff}
#tut .ok{font-size:12px;color:#8ff08a;text-shadow:2px 2px 0 #000;animation:okp .35s ease-out}
@keyframes okp{from{transform:scale(.3)}to{transform:scale(1)}}
#tut .keys{display:flex;gap:8px;align-items:flex-end}
#tut .keys b{display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:#4f86c6;border:2px solid #fff}
#tut .keys b svg{width:14px;height:14px;fill:#fff}#tut .keys b.ok{border-color:#8ff08a}#tut .keys b.ok svg{fill:#8ff08a}
#tut .keys .gap{width:14px}#tut .keys span{display:block;font-size:6px;color:#ffe08a;margin-top:4px}
#tut .keys div{display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="tut" aria-live="polite"></div>
<div id="pad"><div class="grp"><button data-k="left" aria-label="Andar para a esquerda"><svg viewBox="0 0 7 7"><path d="M1 3h1V2h1V1h1V0h1v7H4V6H3V5H2V4H1z"/></svg></button><button data-k="right" aria-label="Andar para a direita"><svg viewBox="0 0 7 7"><path d="M6 3H5V2H4V1H3V0H2v7h1V6h1V5h1V4h1z"/></svg></button></div><button data-k="jump" aria-label="Pular"><svg viewBox="0 0 7 7"><path d="M3 0h1v1h1v1h1v1h1v1H5v3H2V4H0V3h1V2h1V1h1z"/></svg></button></div>
<div id="endbar"></div></div>
<div id="overlay"></div>
<script>
(()=>{
'use strict';
const c=document.getElementById('c'),ctx=c.getContext('2d'),wrap=document.getElementById('wrap');
const T=24,ROWS=15;
let VW=240,VH=520,PADB=104,OYW=VH-PADB-ROWS*T;

/* ================= SPRITE HELPERS ================= */
const grid=(w,h)=>Array.from({length:h},()=>Array(w).fill('.'));
const put=(g,x,y,ch)=>{if(y>=0&&y<g.length&&x>=0&&x<g[0].length)g[y][x]=ch};
const stamp=(g,a,x,y)=>a.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]!=='.')put(g,x+i,y+j,r[i])});
// contorno automático por fora + linhas internas entre partes (orelha, coleira, medalha, partes do fundo)
function finish(g){
  const h=g.length,w=g[0].length,o=g.map(r=>r.slice());
  const at=(x,y)=>(x<0||y<0||x>=w||y>=h)?'.':g[y][x];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=g[y][x],nb=[at(x+1,y),at(x-1,y),at(x,y+1),at(x,y-1)];
    if(ch==='.'){if(nb.some(n=>n!=='.'))o[y][x]='k'}
    else if(ch==='w'&&nb.some(n=>n==='e'||n==='b'||n==='t'||n==='s'))o[y][x]='k';
    else if(ch==='b'&&nb.includes('t'))o[y][x]='k';
  }
  return o;
}
function toCanvas(g,pal){
  const cv=document.createElement('canvas');cv.width=g[0].length;cv.height=g.length;
  const x=cv.getContext('2d');
  g.forEach((r,j)=>r.forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=pal[ch]||'#f0f';x.fillRect(i,j,1,1)}}));
  return cv;
}
function flipC(src){
  const f=document.createElement('canvas');f.width=src.width;f.height=src.height;
  const x=f.getContext('2d');x.translate(src.width,0);x.scale(-1,1);x.drawImage(src,0,0);return f;
}
const newCv=(w,h)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;return cv};
const mk=(g,pal)=>{const r=toCanvas(finish(g),pal);return[r,flipC(r)]};
// EPX/Scale2x: dobra o tamanho mantendo o pixel de 1px (mesma densidade do Guido)
function epx(src){
  const w=src.width,h=src.height,d=src.getContext('2d').getImageData(0,0,w,h).data;
  const px=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return 0;const i=(y*w+x)*4;return d[i+3]>0?((d[i]<<16)|(d[i+1]<<8)|d[i+2])+1:0};
  const out=newCv(w*2,h*2),o=out.getContext('2d');
  const dot=(v,x,y)=>{if(!v)return;const c=v-1;o.fillStyle='#'+c.toString(16).padStart(6,'0');o.fillRect(x,y,1,1)};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const P=px(x,y),A=px(x,y-1),B=px(x+1,y),C=px(x-1,y),D=px(x,y+1);
    let p1=P,p2=P,p3=P,p4=P;
    if(C===A&&C!==D&&A!==B)p1=A;if(A===B&&A!==C&&B!==D)p2=B;if(D===C&&D!==B&&C!==A)p3=C;if(B===D&&B!==A&&D!==C)p4=D;
    dot(p1,x*2,y*2);dot(p2,x*2+1,y*2);dot(p3,x*2,y*2+1);dot(p4,x*2+1,y*2+1);
  }
  return out;
}
const big=pair=>pair.map(epx);

/* ================= GUIDO =================
   Contornos traçados da ilustração de referência (coordenadas da imagem original),
   rasterizados em pixel art e contornados automaticamente. */
const S=0.036,OX=340,OY=290,DW=46,DH=50;
function paintM(g,fn,ch,onlyFilled){
  const cv=newCv(DW,DH),x=cv.getContext('2d');
  x.setTransform(S,0,0,S,-OX*S,-OY*S);x.fillStyle=x.strokeStyle='#000';x.lineCap=x.lineJoin='round';x.lineWidth=30;
  fn(x);
  const d=x.getImageData(0,0,DW,DH).data;
  for(let y=0;y<DH;y++)for(let i=0;i<DW;i++)if(d[(y*DW+i)*4+3]>110&&(!onlyFilled||g[y][i]!=='.'))g[y][i]=ch;
}
const shape=f=>x=>{x.beginPath();f(x);x.closePath();x.fill()};
const line=f=>x=>{x.beginPath();f(x);x.stroke()};
const HEAD=shape(x=>{x.moveTo(1060,398);x.lineTo(1250,393);x.quadraticCurveTo(1322,398,1336,470);x.lineTo(1342,508);
  x.lineTo(1450,500);x.quadraticCurveTo(1498,505,1484,548);x.quadraticCurveTo(1440,660,1340,695);
  x.quadraticCurveTo(1230,725,1105,686);x.quadraticCurveTo(1022,600,1040,480)});
const EAR=shape(x=>{x.moveTo(965,395);x.lineTo(1022,410);x.lineTo(1020,352);x.quadraticCurveTo(1090,400,1098,520);
  x.quadraticCurveTo(1095,640,1010,722);x.quadraticCurveTo(960,748,940,700);x.quadraticCurveTo(924,600,928,460);
  x.quadraticCurveTo(940,430,978,428)});
const FAR_EAR=shape(x=>{x.moveTo(1268,398);x.lineTo(1318,358);x.lineTo(1312,388);x.lineTo(1355,382);x.lineTo(1330,412);
  x.quadraticCurveTo(1352,452,1342,505);x.lineTo(1290,500)});
const NECK=shape(x=>{x.moveTo(1003,690);x.lineTo(1250,690);x.lineTo(1268,790);x.lineTo(1275,1000);x.lineTo(985,1000);x.lineTo(1005,790)});
const COLLAR=shape(x=>{x.moveTo(972,782);x.quadraticCurveTo(1130,828,1288,765);x.lineTo(1298,840);x.quadraticCurveTo(1130,897,980,857)});
const TAG=x=>{x.beginPath();x.arc(1205,912,52,0,Math.PI*2);x.fill()};
const NOSE=x=>{x.beginPath();x.ellipse(1442,535,46,37,-0.2,0,Math.PI*2);x.fill()};
const BROW=line(x=>{x.moveTo(1203,460);x.quadraticCurveTo(1222,432,1254,437)});
const SMILE=line(x=>{x.moveTo(1212,604);x.lineTo(1182,628);x.quadraticCurveTo(1252,702,1366,680)});
const JAW=line(x=>{x.moveTo(1105,688);x.quadraticCurveTo(1180,712,1255,712)});
// sentado (igual à referência)
const BODY_SIT=shape(x=>{x.moveTo(990,860);x.quadraticCurveTo(900,985,800,1100);x.quadraticCurveTo(700,1260,698,1480);
  x.lineTo(700,1540);x.quadraticCurveTo(705,1590,752,1590);x.lineTo(1330,1590);x.quadraticCurveTo(1378,1565,1365,1522);
  x.quadraticCurveTo(1335,1478,1292,1470);x.lineTo(1272,1180);x.quadraticCurveTo(1300,1040,1272,860)});
const rotAbout=(x,cx,cy,a)=>{x.translate(cx,cy);x.rotate(a);x.translate(-cx,-cy)};
const TAIL_SIT=a=>shape(x=>{rotAbout(x,690,1450,a);x.moveTo(698,1420);x.quadraticCurveTo(560,1300,575,1100);x.lineTo(594,945);
  x.quadraticCurveTo(470,1080,452,1258);x.lineTo(492,1192);x.lineTo(478,1332);x.lineTo(508,1272);x.lineTo(517,1402);
  x.lineTo(534,1332);x.quadraticCurveTo(600,1432,700,1482)});
const SIT_LINES=[
  line(x=>{x.moveTo(930,1228);x.quadraticCurveTo(1005,1172,1078,1215);x.quadraticCurveTo(1120,1290,1085,1385);x.quadraticCurveTo(1045,1455,985,1490)}),
  line(x=>{x.moveTo(1232,1170);x.lineTo(1245,1400);x.lineTo(1252,1478)}),
  line(x=>{x.moveTo(1100,1528);x.quadraticCurveTo(1128,1548,1134,1590)}),
  line(x=>{x.moveTo(1290,1508);x.quadraticCurveTo(1318,1528,1324,1568)})];
// em pé / correndo
const BODY_RUN=shape(x=>{x.moveTo(990,900);x.lineTo(1272,870);x.quadraticCurveTo(1310,1060,1262,1200);x.quadraticCurveTo(1205,1290,1060,1290);
  x.lineTo(760,1290);x.quadraticCurveTo(610,1285,606,1140);x.quadraticCurveTo(615,1005,770,1000);x.lineTo(960,990)});
const TAIL_RUN=a=>shape(x=>{rotAbout(x,640,1070,a);x.moveTo(660,1030);x.quadraticCurveTo(520,975,468,835);
  x.lineTo(452,915);x.lineTo(490,900);x.lineTo(476,975);x.lineTo(524,955);x.lineTo(528,1030);x.lineTo(578,1012);
  x.quadraticCurveTo(620,1090,690,1120)});
const THIGH_RUN=line(x=>{x.moveTo(655,1150);x.quadraticCurveTo(735,1075,815,1140);x.quadraticCurveTo(842,1215,800,1285)});
const LEG_TOP={nb:[700,1230],fb:[790,1230],nf:[1180,1230],ff:[1252,1215]};
function legShape(top,foot,bob){return x=>{
  x.lineWidth=96;x.beginPath();x.moveTo(top[0],top[1]+bob);x.lineTo(foot[0],foot[1]-34);x.stroke();
  x.beginPath();x.ellipse(foot[0]+28,foot[1]-30,62,30,0,0,Math.PI*2);x.fill()}}
const DOG_PAL={k:'#1d1d1b',w:'#ffffff',s:'#d3d8e4',e:'#ffffff',b:'#4f86c6',t:'#ffffff',o:'#1d1d1b',i:'#ffffff',n:'#1d1d1b'};

function buildDog(o){
  const g=grid(DW,DH),bob=o.bob||0;
  const up=fn=>x=>{x.translate(0,bob);fn(x)};
  paintM(g,up(FAR_EAR),'s');
  if(o.sit){paintM(g,TAIL_SIT(o.tail||0),'w');paintM(g,BODY_SIT,'w')}
  else{
    const L=o.legs; // pés: [nb, fb, nf, ff] => [dx, y]
    const foot=(k,i)=>[LEG_TOP[k][0]+L[i][0],L[i][1]];
    paintM(g,up(TAIL_RUN(o.tail||0)),'w');
    paintM(g,legShape(LEG_TOP.fb,foot('fb',1),bob),'s');paintM(g,legShape(LEG_TOP.ff,foot('ff',3),bob),'s');
    paintM(g,up(BODY_RUN),'w');
    paintM(g,legShape(LEG_TOP.nb,foot('nb',0),bob),'w');paintM(g,legShape(LEG_TOP.nf,foot('nf',2),bob),'w');
  }
  paintM(g,up(NECK),'w');paintM(g,up(HEAD),'w');paintM(g,up(EAR),'e');
  paintM(g,up(COLLAR),'b');paintM(g,up(TAG),'t');paintM(g,up(NOSE),'n');
  const f=finish(g);
  paintM(f,up(JAW),'k',true);
  if(o.sit)SIT_LINES.forEach(l=>paintM(f,l,'k',true));else paintM(f,up(THIGH_RUN),'k',true);
  // rosto pixel a pixel: olho com brilho, sobrancelha e sorriso com "ganchinho"
  const b=Math.round(bob*S),ex=33,ey=8+b;
  for(let i=27;i<=38;i++)for(let j=5+b;j<=14+b;j++)if(f[j][i]==='k'&&i>=28&&i<=37&&j>=6+b&&j<=13+b)f[j][i]='w'; // limpa
  if(o.blink){put(f,ex-1,ey,'k');put(f,ex,ey,'k');put(f,ex+1,ey,'k')}
  else{for(let j=-1;j<=1;j++){put(f,ex-1,ey+j,'o');put(f,ex,ey+j,'o')}put(f,ex,ey-1,'i')}
  [[ex-3,ey-2],[ex-2,ey-3],[ex-1,ey-3],[ex,ey-3]].forEach(([i,j])=>put(f,i,j,'k'));
  [[29,11],[30,12],[31,13],[32,13],[33,13],[34,13],[35,13],[36,12]].forEach(([i,j])=>put(f,i,j+b,'k'));
  // focinho
  for(let i=38;i<=41;i++)for(let j=7+b;j<=9+b;j++)if(f[j][i]!=='.')f[j][i]='n';
  const r=toCanvas(f,DOG_PAL);return[r,flipC(r)];
}
const G=1588,LEG_SHORT=90; // corpo mais baixo = pernas mais curtas ao andar
const run=(l,bob,tail)=>buildDog({legs:l,bob:bob+LEG_SHORT,tail});
const DOG={
  run:[run([[-180,G],[90,G],[190,G],[-90,G]],0,0),run([[-40,G],[40,G],[50,G],[-30,G]],-30,0.15),
       run([[100,G],[-170,G],[-90,G],[190,G]],0,0),run([[40,G],[-40,G],[-30,G],[50,G]],-30,0.15)],
  stand:run([[-10,G],[20,G],[10,G],[-20,G]],0,0),
  jump:run([[-220,1480],[-200,1490],[230,1450],[210,1460]],-30,-0.2),
  fall:run([[-60,1560],[20,1550],[60,1560],[10,1550]],0,0.2),
  sit:[buildDog({sit:true,tail:0}),buildDog({sit:true,tail:-0.12})],
  blink:buildDog({sit:true,tail:0,blink:true})
};
const DOG_CX=Math.round((950-OX)*S);
const DOG_BASE=(()=>{const x=DOG.stand[0].getContext('2d'),d=x.getImageData(0,0,DW,DH).data;
  for(let y=DH-1;y>=0;y--)for(let i=0;i<DW;i++)if(d[(y*DW+i)*4+3])return y+1;return DH})();

/* ================= GUIDO TOMANDO CAFÉ (tela inicial) =================
   Traçado das ilustrações de referência: quadro A segurando o copo (com vapor), quadro B dando um gole. */
const CS=0.036,COX=262,COY=262,CW=48,CH=52;
function paintC(g,fn,ch,only){
  const cv=newCv(CW,CH),x=cv.getContext('2d');
  x.setTransform(CS,0,0,CS,-COX*CS,-COY*CS);x.fillStyle=x.strokeStyle='#000';x.lineCap=x.lineJoin='round';x.lineWidth=30;
  fn(x);
  const d=x.getImageData(0,0,CW,CH).data;

const tileAt=(tx,ty)=>(ty<0||ty>=ROWS||tx<0||tx>=LW)?'.':L.t[ty][tx];
function solidAt(tx,ty){if(tx<0||tx>=LW)return true;const ch=tileAt(tx,ty);return ch==='#'||ch==='C'||ch==='S'||ch==='?'||ch==='X'}

/* ================= FÍSICA ================= */
function moveX(o){
  o.x+=o.vx;let hit=false;
  const top=Math.floor(o.y/T),bot=Math.floor((o.y+o.h-0.01)/T);
  if(o.vx>0){const tx=Math.floor((o.x+o.w-0.01)/T);for(let ty=top;ty<=bot;ty++)if(solidAt(tx,ty)){o.x=tx*T-o.w;hit=true;break}}
  else if(o.vx<0){const tx=Math.floor(o.x/T);for(let ty=top;ty<=bot;ty++)if(solidAt(tx,ty)){o.x=(tx+1)*T;hit=true;break}}
  if(hit)o.vx=0;return hit;
}
function moveY(o){
  const pb=o.y+o.h;o.y+=o.vy;o.onGround=false;let hit=null;
  const l=Math.floor(o.x/T),r=Math.floor((o.x+o.w-0.01)/T);
  if(o.vy>0){const ty=Math.floor((o.y+o.h)/T);
    for(let tx=l;tx<=r;tx++){const ch=tileAt(tx,ty);if(solidAt(tx,ty)||((ch==='='||ch==='F')&&pb<=ty*T+0.5)){o.y=ty*T-o.h;o.vy=0;o.onGround=true;break}}}
  else if(o.vy<0){const ty=Math.floor(o.y/T);let best=null,bd=1e9;
    for(let tx=l;tx<=r;tx++)if(solidAt(tx,ty)){const d=Math.abs(tx*T+8-(o.x+o.w/2));if(d<bd){bd=d;best=tx}}
    if(best!==null){o.y=(ty+1)*T;o.vy=0;hit={x:best,y:ty}}}
  return hit;
}

let actx=null;
function unlockAudio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function sfx(type){
  try{
    if(!actx)return;
    const t0=actx.currentTime;
    const tone=(f1,f2,dur,start=0,wave='square',vol=0.07)=>{
      const o=actx.createOscillator(),g=actx.createGain();o.type=wave;o.connect(g);g.connect(actx.destination);
      o.frequency.setValueAtTime(f1,t0+start);o.frequency.exponentialRampToValueAtTime(f2,t0+start+dur);
      g.gain.setValueAtTime(vol,t0+start);g.gain.exponentialRampToValueAtTime(0.001,t0+start+dur);
      o.start(t0+start);o.stop(t0+start+dur+0.02)};
    if(type==='jump')tone(280,620,0.14);
    else if(type==='bean'){ // grão de café: estalinho crocante + "toc" de madeira (sem cara de moeda)
      const len=Math.floor(actx.sampleRate*0.05),buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
      const n=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
      f.type='bandpass';f.frequency.value=2400;f.Q.value=1.2;g.gain.value=0.35;
      n.buffer=buf;n.connect(f);f.connect(g);g.connect(actx.destination);n.start(t0);
      tone(520,240,0.08,0,'sine',0.16)}
    else if(type==='stomp')tone(320,90,0.12);
    else if(type==='bump')tone(140,90,0.08,0,'triangle',0.12);
    else if(type==='die'){tone(660,330,0.25);tone(330,90,0.5,0.25)}
    else if(type==='up')[523,659,784,1047].forEach((f,i)=>tone(f,f,0.1,i*0.08));
    else if(type==='win')[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,f,0.14,i*0.12));
    else if(type==='splash'){tone(500,70,0.3,0,'triangle',0.14);[0.18,0.3,0.45].forEach((s,i)=>tone(300+i*90,700+i*120,0.06,s,'sine',0.08))}
    else if(type==='sugar'){[1175,880,660,440].forEach((f,i)=>tone(f,f*0.9,0.07,i*0.06,'triangle',0.1))}
    else if(type==='thud')tone(110,40,0.25,0,'triangle',0.2);
    else if(type==='crack'||type==='sizzle'){ // biscoito estalando / chiado da água fervendo
      const dur=type==='crack'?0.09:0.35,len=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,type==='crack'?4:1.5);
      const n=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
      f.type=type==='crack'?'bandpass':'highpass';f.frequency.value=type==='crack'?1100:3500;g.gain.value=type==='crack'?0.4:0.18;
      n.buffer=buf;n.connect(f);f.connect(g);g.connect(actx.destination);n.start(t0)}
    else if(type==='woof'){tone(220,140,0.09,0,'sawtooth',0.06);tone(240,150,0.1,0.14,'sawtooth',0.06)}
  }catch(e){}
}

const input={left:false,right:false,jump:false,jumpPressed:false};

const PW=22,PH=38;
function newPlayer(tx){return{x:tx*T,y:13*T-PH,w:PW,h:PH,vx:0,vy:0,face:1,onGround:false,coyote:0,buf:0,air2:true,runT:0,still:0,dead:false,inv:0}}

  flagY=0;checkK=0;winPhase=0;cheerT=-1;cam=0;state='play';resetInput();hideOverlay();sfx('woof');if(fromTitle)startTut();else endTut()}
function dust(x,y,n=5){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*1.6,vy:-Math.random()*1.2,life:18+Math.random()*10,col:'#ffffff',s:2})}

// caiu no café com açúcar: afunda devagar e aparece o balão
function coffeeDie(){if(P.dead)return;P.dead=true;P.coffee=true;P.vx=0;P.vy=0.5;deadT=0;P.bx=P.x+P.w/2;
  P.water=isWater(Math.floor(P.bx/T));sfx('splash');if(P.water)sfx('sizzle'); // poço de água fervendo
  const sx=P.x+P.w/2;for(let i=0;i<14;i++)particles.push({x:sx+(Math.random()-.5)*14,y:COFFEE_Y,vx:(Math.random()-.5)*2.4,vy:-1.5-Math.random()*2.5,life:24+Math.random()*12,

/* ---- biscoitos que desmancham ---- */
function startCrumble(tx,ty){ // pisou: o biscoito inteiro (todos os pedaços vizinhos) começa a tremer
  if(crumble.has(ty*1000+tx))return;sfx('crack');
  let a=tx,b=tx;while(tileAt(a-1,ty)==='F')a--;while(tileAt(b+1,ty)==='F')b++;
  for(let x=a;x<=b;x++)if(!crumble.has(ty*1000+x))crumble.set(ty*1000+x,{tx:x,ty,t:0,gone:false,r:0})}
function updateCrumble(){
  for(const [k,c] of crumble){
    if(!c.gone){c.t++;
      if(c.t%14===0)particles.push({x:c.tx*T+4+Math.random()*16,y:c.ty*T+10,vx:0,vy:0.5,life:20,col:'#b9772c',s:1}); // farelos
      if(c.t>=CRUMBLE_T){c.gone=true;L.t[c.ty][c.tx]='.';falling.push({x:c.tx*T,y:c.ty*T,vy:0.5,a:0});
        if(c.tx%2===0)sfx('crack');
        for(let i=0;i<5;i++)particles.push({x:c.tx*T+Math.random()*T,y:c.ty*T+4,vx:(Math.random()-.5)*1.8,vy:-Math.random()*1.5,life:22,col:i%2?'#e3a54f':'#7a4520',s:2})}}
    else if(++c.r>RESPAWN_T&&!(P.x<c.tx*T+T&&P.x+P.w>c.tx*T&&P.y<c.ty*T+11&&P.y+P.h>c.ty*T)){ // volta (se o Guido não estiver ali)
      L.t[c.ty][c.tx]='F';crumble.delete(k);sparkle(c.tx*T+12,c.ty*T+5)}}
  for(const f of falling){f.vy=Math.min(f.vy+0.3,7);f.y+=f.vy;f.a+=0.06;
    if(f.y>COFFEE_Y-6&&!f.sp){f.sp=1;for(let i=0;i<5;i++)particles.push({x:f.x+Math.random()*T,y:COFFEE_Y,vx:(Math.random()-.5)*2,vy:-1-Math.random()*2,life:18,col:i%2?'#ffffff':'#a9e2fb',s:2})}}
  falling=falling.filter(f=>f.y<COFFEE_Y+30);
}

/* ================= UPDATE ================= */
function update(){
  frame++;
  if(P&&P.sayT)P.sayT=P.sayT>110?0:P.sayT+1; // tempo do balão do açúcar
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life--});particles=particles.filter(p=>p.life>0);
  pops.forEach(p=>{p.y+=p.vy;p.vy+=0.25;p.life--;if(p.life<=0)flyBean(p.x,p.y)});pops=pops.filter(p=>p.life>0);
  fly.forEach(f=>f.t++);fly=fly.filter(f=>f.t<FLY_T);
  for(const [k,v] of bumps){if(v<=1)bumps.delete(k);else bumps.set(k,v-1)}
  if(state==='title'){P.still++;return}
  if(state==='play')updatePlayer();
  else if(state==='win')updateWin();
  if(state==='play'||state==='win'){if(!tut)updateEnemies();updateLost();updateCrumble()}
  if(tut&&state==='play')tutTick();
  const target=Math.max(0,Math.min(LW*T-VW,P.x+P.w/2-VW*0.36));
  cam+=(target-cam)*0.18;
}
function updatePlayer(){
  if(P.dead){deadT++;
    if(P.coffee){P.y+=P.vy;if(deadT%9===0&&deadT<90)particles.push({x:P.bx+(Math.random()-.5)*10,y:COFFEE_Y-1,vx:0,vy:-0.6,life:14,col:'#f3e2c0',s:2})}
    else{P.vy+=0.35;P.y+=P.vy}
    if(deadT>(P.coffee?170:110))newGame();return} // sem fim de jogo: volta para o começo
  if(P.inv>0)P.inv--;
  // começo da fase: sentado tomando café até o jogador usar algum comando
  if(P.sipping){if(input.left||input.right||input.jump||input.jumpPressed)P.sipping=false;else P.sipT++}
  const dir=(input.right?1:0)-(input.left?1:0);
  const max=2.8;
  if(dir){
    const turning=Math.sign(P.vx)===-dir&&Math.abs(P.vx)>0.3;
    P.vx+=dir*(P.onGround?(turning?0.6:0.32):0.26);
    if(Math.abs(P.vx)>max)P.vx=Math.sign(P.vx)*max;P.face=dir;
    if(turning&&P.onGround&&frame%4===0)dust(P.x+P.w/2,P.y+P.h,1);
  }else{const f=P.onGround?0.24:0.06;P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f}
  if(input.jumpPressed){P.buf=8;input.jumpPressed=false}
  P.coyote=P.onGround?6:P.coyote-1;
  if(P.onGround)P.air2=true; // pulo duplo recarrega ao tocar o chão
  if(P.buf>0&&P.coyote>0){P.vy=-9.6;P.coyote=0;P.buf=0;P.onGround=false;sfx('jump');dust(P.x+P.w/2,P.y+P.h,3)}
  else if(P.buf>0&&P.air2){P.vy=-8.4;P.buf=0;P.air2=false;sfx('jump');sparkle(P.x+P.w/2,P.y+P.h)} // pulo duplo no ar
  P.buf--;
  P.vy=Math.min(P.vy+((P.vy<0&&input.jump)?0.42:0.95),9);
  moveX(P);
  const air=!P.onGround,vyBefore=P.vy,prevBottom=P.y+P.h;
  const hit=moveY(P);
  if(air&&P.onGround&&vyBefore>3)dust(P.x+P.w/2,P.y+P.h,4);
  if(hit)bumpTile(hit.x,hit.y);
  if(P.onGround){const ty=Math.floor((P.y+P.h)/T); // pisou num biscoito: ele começa a desmanchar
    for(let tx=Math.floor(P.x/T);tx<=Math.floor((P.x+P.w-0.01)/T);tx++)if(tileAt(tx,ty)==='F')startCrumble(tx,ty)}
  if(P.y+P.h>COFFEE_Y+6)coffeeDie();
  for(const b of beans)if(!b.got&&P.x<b.x+20&&P.x+P.w>b.x&&P.y<b.y+20&&P.y+P.h>b.y){b.got=true;getBean();sparkle(b.x+10,b.y+10);flyBean(b.x,b.y)}
  if(checkpoint<CHECK_X&&P.x>CHECK_X*T){checkpoint=CHECK_X;sfx('up')}
  if(checkpoint>=CHECK_X&&checkK<1)checkK=Math.min(1,checkK+0.04); // bandeira do checkpoint sobe
  for(const e of enemies){
    if(e.dead||!e.active||(e.type==='boil'&&!e.up))continue; // a gota só machuca fora d'água
    if(P.x+2<e.x+e.w&&P.x+P.w-2>e.x&&P.y+6<e.y+e.h&&P.y+P.h>e.y){
      // pulou bem em cima de um cubo de açúcar: amassa ele e quica (a montanha não morre)
      if(e.type==='sugar'&&vyBefore>0&&prevBottom<=e.y+8){
        e.dead=1;e.vx=0;sfx('stomp');P.vy=input.jump?-8:-5;P.onGround=false;P.air2=true;
        for(let i=0;i<6;i++)particles.push({x:e.x+e.w/2,y:e.y+e.h-4,vx:(Math.random()-.5)*2.4,vy:-Math.random()*1.5,life:18,col:'#ffffff',s:2});
        continue}
      if(P.inv<=0)dropBeans(e);
    }
  }
  if(P.x+P.w>=POLE_X&&!P.dead){state='win';endTut();winPhase=0;winT=0;P.vx=0;P.vy=0;P.x=POLE_X-P.w+3;
    sfx('win')}
}
function bumpTile(tx,ty){

  if(ch==='?'){L.t[ty][tx]='X';pops.push({x:tx*T+2,y:ty*T-14,vy:-5.5,life:26});getBean()}
  else sfx('bump');
  if(ch==='?'||ch==='C'||ch==='S')bumps.set(ty*1000+tx,10);
  for(const e of enemies)if(!e.dead&&e.active&&e.type!=='boil'&&Math.abs(e.y+e.h-ty*T)<3&&e.x<tx*T+T&&e.x+e.w>tx*T){
    e.dead=1;e.flip=true;e.vy=-5;sfx('stomp')}
}
function updateEnemies(){
  for(const e of enemies){
    if(!e.active){if(e.x<cam+VW+40)e.active=true;else continue}
    if(e.dead){e.dead++;if(e.flip){e.vy+=0.3;e.y+=e.vy;e.x+=0.6}continue}

  _m:{acute:[[3,-2],[2,-1]],tilde:[[1,-2],[2,-2],[4,-2],[0,-1],[3,-1]],ced:[[2,7],[2,8],[1,8]]}};
const bw=(s,F=BFONT)=>[...s].reduce((w,ch)=>w+F[BMARK[ch]?BMARK[ch][0]:ch][0].length+1+(F.bold?1:0),0)-1;
const BFONT7B={...BFONT7,bold:1}; // mesma fonte 5x7, em negrito
function btext(s,px,py,k,col,F=BFONT){ // py = topo da letra (acentos ficam 2 linhas acima)
  ctx.fillStyle=col;let x=px;
  for(const ch of s){const m=BMARK[ch],g=F[m?m[0]:ch];
    const bk=F.bold?2*k:k; // negrito: cada pixel ganha +1 de largura
    g.forEach((r,j)=>{for(let q=0;q<r.length;q++)if(r[q]==='1')ctx.fillRect(x+q*k,py+j*k,bk,k)});
    if(m)F._m[m[1]].forEach(([a,b])=>ctx.fillRect(x+a*k,py+b*k,bk,k));
    x+=(g[0].length+1+(F.bold?1:0))*k}
}
function drawBubble(cx){
  if(P.dead&&P.coffee&&deadT>=6)speech(Math.round(P.bx-cx),COFFEE_Y-44,deadT-6,...(P.water?['ÁGUA FERVENDO','AAAAI!']:['CAFÉ COM AÇÚCAR','NÃÃÃÃO!']));
  else if(!P.dead&&P.sayT)speech(Math.round(P.x+P.w/2-cx),Math.round(P.y)-6,P.sayT-1,'',P.sayTxt||'AÇÚCAR NÃO!',1,1,5,2,BFONT7B); // fonte 5x7 menor, num balão do tamanho de antes
}
// balão: ax = x do Guido na tela, baseY = onde fica a base do balão (o rabinho aponta para baixo)
function speech(ax,baseY,t,L1,L2,k1=2,k2=3,pad=8,bk=k2,F2=BFONT){ // bk = tamanho de letra usado para medir o balão
  const u=2;
  const top=L1?2*k1+5*k1+2*k1+4:0; // L1 vazio = balão de uma linha só
  const w1=L1?bw(L1)*k1:0,w2=bw(L2,F2)*k2,W=Math.max(w1,bw(L2)*bk)+pad*2,H=pad+top+2*bk+5*bk+pad;
  const pop=t<8?[6,-3,-2,-1,1,1,0,0][t]:0;
  const bx=Math.max(4,Math.min(VW-4-W,ax-Math.round(W/2))),by=Math.max(4-OYW,baseY-H)+pop;
  const rr=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(x+u,y,w-2*u,h);ctx.fillRect(x,y+u,w,h-2*u)};
  rr(bx+u*2,by+u*2,W,H,'rgba(0,0,0,.35)');                 // sombra
  rr(bx,by,W,H,'#1d1d1b');rr(bx+u,by+u,W-2*u,H-2*u,'#ffffff');
  ctx.fillStyle='#d3d8e4';ctx.fillRect(bx+u*2,by+H-u*2,W-u*4,u); // sombreado interno
  // rabinho apontando para o Guido
  const tx=Math.max(bx+u*4,Math.min(bx+W-u*8,ax-u*2)),ty=by+H-u;
  for(let i=0;i<4;i++){ctx.fillStyle='#1d1d1b';ctx.fillRect(tx+i*u-u,ty+i*u,(4-i)*u+u*2,u);
    if(i<3){ctx.fillStyle='#ffffff';ctx.fillRect(tx+i*u,ty+i*u,(4-i)*u-u+u,u)}}
  ctx.fillStyle='#1d1d1b';ctx.fillRect(tx+u*3,ty+u*4,u*2,u);
  const shake=t>10&&t%6<3?1:0;
  if(L1)btext(L1,bx+Math.round((W-w1)/2),by+pad+2*k1,k1,'#1d1d1b');
  const ty2=L1?by+pad+top+2*bk+Math.round((5*bk-F2.A.length*k2)/2) // 2 linhas: logo abaixo da 1ª
    :by+u+Math.floor((H-2*u-F2.A.length*k2)/2);                             // 1 linha: centro do balão
  btext(L2,bx+Math.floor((W-w2)/2)+shake,ty2,k2,'#c8321e',F2);
}

function render(){
  const cx=Math.round(cam);
  ctx.imageSmoothingEnabled=false;
  if(!skyGrad){skyGrad=ctx.createLinearGradient(0,0,0,VH);skyGrad.addColorStop(0,'#4fb0f0');skyGrad.addColorStop(1,'#c6ecff')}
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,VW,VH);
  ctx.save();ctx.translate(0,OYW+(shake>0?(shake--%2?2:-2):0));
  drawBG(cx);drawUnderground(cx);drawProps(cx);drawTiles(cx);drawBeans(cx);drawEnemies(cx);drawPlayer(cx);drawCoffee(cx);
  for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/10);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x-cx),Math.round(p.y),p.s,p.s)}
  ctx.globalAlpha=1;drawBubble(cx);ctx.restore();
  if(state!=='title')drawHUD();
  const po=state==='play';if(pad.classList.contains('on')!==po){pad.classList.toggle('on',po);if(!po)resetInput()}
}
/* ---- contador de grãos no topo da tela ---- */
let hudLast=0,hudPop=0,hudLost=0,hudBX=0,hudBY=0;const FLY_T=32;
function drawHUD(){
  const shown=Math.max(0,beanCount-fly.length-pops.length); // grãos ainda voando não contam até chegar
  if(shown>hudLast)hudPop=8;else if(shown<hudLast)hudLost=40;
  hudLast=shown;
  const txt='x'+shown,k=2,tw=bw(txt)*k,W=8+20+4+tw+8,H=28,x=Math.round((VW-W)/2),y=SAFE_TOP+6,u=2;
  const rr=(a,b,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(a+u,b,w-2*u,h);ctx.fillRect(a,b+u,w,h-2*u)};
  rr(x,y,W,H,'#1d1d1b');rr(x+u,y+u,W-2*u,H-2*u,hudLost>0&&(hudLost>>2)%2?'#c8321e':'#4f86c6');
  ctx.fillStyle='#2f5f9e';ctx.fillRect(x+u*2,y+H-u*2,W-u*4,u);
  const s=hudPop>0?[0,2,4,4,3,2,1,0][8-hudPop]:0;
  const bs=16+s; // grão do contador: 20% menor que o sprite (20 → 16), centrado no mesmo espaço
  ctx.drawImage(BEAN2,Math.round(x+8+10-bs/2),Math.round(y+14-bs/2),bs,bs);
  btext(txt,x+8+20+5,y+10,k,'#1d1d1b');btext(txt,x+8+20+4,y+9,k,'#ffffff');
  if(hudPop>0)hudPop--;if(hudLost>0)hudLost--;
  hudBX=x+8+10;hudBY=y+14;drawFly();
}
// grãos voando: sobem num arco até o grão do contador, encolhendo, com um rastro curto
function drawFly(){
  for(const f of fly){
    for(let g=2;g>=0;g--){const t=f.t-g*2;if(t<0)continue;
      const p=t/FLY_T,e=p*p*(3-2*p),x0=f.x+f.sz/2,y0=f.y+f.sz/2,
        qx=x0+(hudBX-x0)*0.15,qy=Math.min(y0,hudBY)-30, // ponto de controle: um pulinho para cima antes de ir pro contador
        bx=(1-e)*(1-e)*x0+2*(1-e)*e*qx+e*e*hudBX,by=(1-e)*(1-e)*y0+2*(1-e)*e*qy+e*e*hudBY,
        bs=Math.round(f.sz+(16-f.sz)*e+(p<0.2?p*15:0));
      ctx.globalAlpha=g?0.25/g:1;ctx.drawImage(BEAN2,Math.round(bx-bs/2),Math.round(by-bs/2),bs,bs)}
    ctx.globalAlpha=1}
}

/* ================= TELAS ================= */
const ov=document.getElementById('overlay');
const endbar=document.getElementById('endbar');
function hideOverlay(){titleBox=null;document.documentElement.classList.remove('menu-on');ov.classList.add('hidden');ov.classList.remove('menu','win');ov.innerHTML='';ov.style.bottom='';endbar.className='';endbar.innerHTML=''}
function show(html,act=newGame){titleBox=null;document.documentElement.classList.remove('menu-on');ov.innerHTML=html;ov.classList.remove('hidden','menu','win');ov.style.bottom='';endbar.className='';endbar.innerHTML='';
  const b=ov.querySelector('.play');if(b)b.addEventListener('click',e=>{e.stopPropagation();unlockAudio();act()})}
function goTitle(){ // volta para a tela inicial
  buildLevel();beanCount=0;checkpoint=2;P=newPlayer(2);P.still=30;particles=[];pops=[];fly=[];lost=[];bumps.clear();
  flagY=0;checkK=0;winPhase=0;cheerT=-1;cam=0;state='title';resetInput();endTut();showTitle()}
function showTitle(){
  show(`<div class="sign" role="img" aria-label="Guido Café &amp; Co."></div><canvas id="prev" width="${CW}" height="${CH}"></canvas><button class="play low">JOGAR ▶</button>`);
  ov.classList.add('menu');document.documentElement.classList.add('menu-on');
  const sg=ov.querySelector('.sign'),sc=makeSign(),sp=Math.max(2,Math.min(6,Math.floor(Math.min(innerWidth*0.82,360)/sc.width)));
  sc.style.width=sc.width*sp+'px';sc.style.height=sc.height*sp+'px';sg.style.setProperty('--p',sp+'px');sg.appendChild(sc);
  const pv=document.getElementById('prev'),px=pv.getContext('2d');let i=0;
  (function anim(){if(!document.body.contains(pv))return;px.clearRect(0,0,CW,CH); // segura o copo (vapor) e de vez em quando dá um gole
    const t=i%300,sip=t>=200&&t<270,set=sip?DOG_SIP.sip:DOG_SIP.hold;px.drawImage(set[Math.floor(i/16)%2],0,0);
    if(!sip)for(let s=0;s<2;s++)for(let k=0;k<3;k++){const ph=(i*0.12+k*3+s*1.5)%9;px.globalAlpha=Math.max(0,1-ph/9)*0.9;px.fillStyle='#fff';
      px.fillRect(39+s*3+Math.round(Math.sin((i+k*20+s*35)/14)),Math.round(13-ph),1,1)}
    px.globalAlpha=1;i++;requestAnimationFrame(anim)})();
}
function placeWin(){ // a área do título vai do topo da tela até o topo da cafeteria, e ele fica no meio dela
  if(!ov.classList.contains('win'))return;const r=c.getBoundingClientRect(),k=r.height/VH;
  ov.style.bottom=Math.max(0,innerHeight-(r.top+(OYW+13*T-SHOP.height)*k))+'px';
  const b=[...ov.children].map(e=>e.getBoundingClientRect()),m=6; // caixa do título + subtítulo, com folga
  titleBox={x0:(Math.min(...b.map(q=>q.left))-r.left)/k-m,x1:(Math.max(...b.map(q=>q.right))-r.left)/k+m,
    y0:(Math.min(...b.map(q=>q.top))-r.top)/k-OYW-m,y1:(Math.max(...b.map(q=>q.bottom))-r.top)/k-OYW+m}}
addEventListener('resize',()=>requestAnimationFrame(placeWin));
function showWin(){
  show(`<div class="title" aria-label="PARABÉNS">PARAB<span class="ac">E</span>NS</div><div class="big">Agora a Guido tem café!</div>`);
  ov.classList.add('win');placeWin();
  endbar.innerHTML='<button class="play">JOGAR NOVAMENTE</button>';endbar.className='on';
  endbar.querySelector('.play').addEventListener('click',e=>{e.stopPropagation();unlockAudio();goTitle()})}

/* ================= TUTORIAL =================
   Logo depois da tela inicial, um passo só: andar com ◀ ▶ e pular com ▲. Some no primeiro toque.
   Os inimigos ficam parados até o tutorial acabar. */
const tutEl=document.getElementById('tut');let tut=null;
const ICO=k=>document.querySelector(`#pad [data-k="${k}"] svg`).outerHTML;
function startTut(){tut={};
  tutEl.innerHTML='<div class="tt">CONTROLES</div><div class="keys">'+
    `<div><b data-t="walk">${ICO('left')}</b></div><div><b data-t="walk">${ICO('right')}</b></div><div class="gap"></div><div><b data-t="jump">${ICO('jump')}</b></div></div>`+
    '<div class="tx">Use as setas para andar e o botão de cima para pular. Pegue os grãos e chegue à cafeteria!</div>';
  tutEl.className='on'}
function endTut(){tut=null;tutEl.className='';tutEl.innerHTML=''}
function tutTick(){if(input.left||input.right||input.jump)endTut()} // sumiu assim que o jogador usou um comando

/* ================= CONTROLES =================
   Botões na faixa de baixo: ◀ ▶ andam, ▲ pula (segurar = pulo mais alto; aperte de novo no ar = pulo duplo).
   Teclado: setas/A/D para andar, espaço/↑/W para pular. */
const pad=document.getElementById('pad'),btnOf=new Map(); // pointerId → botão pressionado
function resetInput(){input.left=input.right=input.jump=input.jumpPressed=false;btnOf.clear();pad.querySelectorAll('.dn').forEach(b=>b.classList.remove('dn'))}
function tap(){input.jumpPressed=true;input.jump=true}
function press(b,on){const k=b.dataset.k;b.classList.toggle('dn',on);
  if(k==='jump'){if(on&&!input.jump)tap();else if(!on)input.jump=false}else input[k]=on}
// o dedo pode deslizar de um botão para o outro sem levantar
function ptrAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest('#pad button')}
function ptrUpdate(e){const nb=state==='play'?ptrAt(e):null,ob=btnOf.get(e.pointerId);if(nb===ob)return;
  if(ob){btnOf.delete(e.pointerId);if(![...btnOf.values()].includes(ob))press(ob,false)}
  if(nb){btnOf.set(e.pointerId,nb);press(nb,true)}}
pad.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();try{pad.setPointerCapture(e.pointerId)}catch(_){}ptrUpdate(e)});
pad.addEventListener('pointermove',e=>{if(btnOf.has(e.pointerId)||e.buttons)ptrUpdate(e)});
const endPtr=e=>{const ob=btnOf.get(e.pointerId);btnOf.delete(e.pointerId);if(ob&&![...btnOf.values()].includes(ob))press(ob,false)};
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pad.addEventListener(ev,endPtr));
pad.addEventListener('contextmenu',e=>e.preventDefault());
wrap.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio()});
const KEYS_J=['Space','ArrowUp','KeyW','KeyZ','KeyK'];
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=true;
  else if(e.code==='ArrowRight'||e.code==='KeyD')input.right=true;
  else if(KEYS_J.includes(e.code)){if(!input.jump)tap();input.jump=true}
  else if(e.code==='Enter'&&state!=='play'&&state!=='win'){unlockAudio();newGame()}
  else return;
  e.preventDefault();
});
addEventListener('keyup',e=>{if(KEYS_J.includes(e.code))input.jump=false;if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=false});
addEventListener('blur',resetInput);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ================= LAYOUT (vertical, proporção de celular) ================= */
let SAFE_TOP=0;
function resize(){
  const vw=innerWidth,vh=innerHeight;let cw,ch;
  if(!vw||!vh)return; // janela ainda sem tamanho (evita VH = NaN)
  VW=240;
  if(vh>=vw){VH=Math.round(Math.min(600,Math.max(440,VW*vh/vw)));cw=vw;ch=vw*VH/VW;if(ch>vh){ch=vh;cw=vh*VW/VH}}
  else{VH=520;ch=vh;cw=vh*VW/VH}
  wrap.style.width=Math.round(cw)+'px';wrap.style.height=Math.round(ch)+'px';
  PADB=Math.round(VH*0.2); // faixa de baixo (chão) livre para o dedo
  // área do notch (iPhone): o contador fica abaixo dela
  const pr=document.createElement('div');pr.style.cssText='position:fixed;top:0;height:0;padding-top:env(safe-area-inset-top)';
  document.body.appendChild(pr);const st=pr.getBoundingClientRect().height;pr.remove();
  const top=wrap.getBoundingClientRect().top||(vh-ch)/2;SAFE_TOP=Math.max(0,Math.ceil((st-top)*VW/cw));
  c.width=VW;c.height=VH;OYW=VH-PADB-ROWS*T;ctx.imageSmoothingEnabled=false;skyGrad=null;
  if(P)cam=Math.max(0,Math.min(LW*T-VW,cam));
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ================= LOOP ================= */
let last=performance.now(),acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  acc+=Math.min(100,ts-last);last=ts;
  while(acc>=1000/60){update();acc-=1000/60}
  render();
}
resize();buildLevel();P=newPlayer(2);P.still=30;checkpoint=2;showTitle();
requestAnimationFrame(loop);
window.__guido={get P(){return P},get state(){return state},get beans(){return beanCount},get lost(){return lost},get enemies(){return enemies},get tut(){return tut},input,DOG,DOG_SIP,makeSign,step:n=>{for(let i=0;i<n;i++)update();render()}};
})();
</script>
